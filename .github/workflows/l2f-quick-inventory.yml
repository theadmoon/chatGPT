name: L2F Quick Inventory synthetic Windows test
on:
  push:
    branches: [l2f-quick-inventory-ci]
  workflow_dispatch:
jobs:
  inventory:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test on native Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSEdition -ne 'Desktop') { throw 'NOT_PS_5_1' }
          $src = Join-Path $env:RUNNER_TEMP 'l2f-synthetic-input'
          $dst = Join-Path $env:RUNNER_TEMP 'l2f-synthetic-reports'
          New-Item -ItemType Directory -Force -Path $src, $dst | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $src 'subfolder') | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $src 'one.mp4'), [byte[]](1,2,3))
          [IO.File]::WriteAllBytes((Join-Path $src 'subfolder\two.MOV'), [byte[]](4,5))
          [IO.File]::WriteAllBytes((Join-Path $src 'image.jpg'), [byte[]](6))
          [IO.File]::WriteAllBytes((Join-Path $src 'unfinished.yandex_disk_download'), [byte[]](7))
          [IO.File]::WriteAllBytes((Join-Path $src 'readme.txt'), [byte[]](8))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File quick_inventory/APP/Inventory.ps1 -Root $src -OutputDir $dst
          if ($LASTEXITCODE -ne 0) { throw "Inventory failed: $LASTEXITCODE" }
          $zip = Get-ChildItem -LiteralPath $dst -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'MISSING_REPORT_ZIP' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $jsonEntry = $z.Entries | Where-Object { $_.Name -eq 'SUMMARY.json' } | Select-Object -First 1
            if (-not $jsonEntry) { throw 'MISSING_SUMMARY_JSON' }
            $reader = New-Object IO.StreamReader($jsonEntry.Open())
            try { $summary = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($summary.status -ne 'COMPLETE' -or $summary.counts.files_total -ne 5 -or $summary.counts.video_files -ne 2 -or $summary.counts.image_files -ne 1 -or $summary.counts.partial_downloads -ne 1 -or $summary.counts.other_files -ne 1 -or $summary.counts.subdirectories -ne 1 -or $summary.total_file_bytes -ne 8) { throw ('COUNTS_MISMATCH: '+($summary|ConvertTo-Json -Depth 6)) }
            Write-Host 'QUICK_INVENTORY_WINDOWS_PS51_PASS'
          } finally { $z.Dispose() }
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-inventory-windows-evidence
          path: ${{ runner.temp }}/l2f-synthetic-reports/**
          if-no-files-found: warn
