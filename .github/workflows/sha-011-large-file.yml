name: L2F SHA 0.1.1 2GiB Regression
on:
  push:
    branches: [l2f-quick-inventory-ci]
  workflow_dispatch:
jobs:
  large:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Hash synthetic file bigger than 2GiB using Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'large-scan'
          $src=Join-Path $env:RUNNER_TEMP 'large-src'
          New-Item -ItemType Directory -Force -Path (Join-Path $dir 'APP'),$src|Out-Null
          $b64=(Get-Content 'sha_inventory_011/Scan.ps1.gz.b64' -Raw).Trim()
          $mem=New-Object IO.MemoryStream(,[Convert]::FromBase64String($b64))
          $gz=New-Object IO.Compression.GZipStream($mem,[IO.Compression.CompressionMode]::Decompress)
          $p=Join-Path $dir 'APP/Scan.ps1'
          $w=[IO.File]::Create($p)
          try{$gz.CopyTo($w)}finally{$w.Dispose();$gz.Dispose();$mem.Dispose()}
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a86806185f9cb19969afb84b0f2b33305470bcaaef39a1e7b51bb20c51e85389'){throw 'SCRIPT_HASH_MISMATCH'}
          @{sources=@(@{path=$src;legacy_source='';expected_volume_label='';expected_total_bytes=0})}|ConvertTo-Json -Depth 5|Set-Content (Join-Path $dir 'SOURCES.json') -Encoding UTF8
          $big=Join-Path $src 'big.mp4'
          $fs=New-Object IO.FileStream($big,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try{$fs.SetLength([long]2147483683)}finally{$fs.Dispose()}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p -PackageRoot $dir
          if($LASTEXITCODE -ne 0){throw ('FIRST_EXIT='+$LASTEXITCODE)}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p -PackageRoot $dir
          if($LASTEXITCODE -ne 0){throw ('SECOND_EXIT='+$LASTEXITCODE)}
          $records=@(Get-Content -LiteralPath (Join-Path $dir 'STATE/SHA_CACHE.jsonl') | Where-Object {$_})
          if($records.Count -ne 1){throw ('NOT_EXACTLY_ONE_COMPLETED_HASH='+$records.Count)}
          $rec=$records[0]|ConvertFrom-Json
          if($rec.size -ne [long]2147483683 -or $rec.sha256 -notmatch '^[0-9a-f]{64}$'){throw 'HASH_BAD'}
          Write-Host 'SHA_GT_2GIB_WINDOWS_PASS'
